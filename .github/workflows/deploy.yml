name: deploy

# Builds branch `international`, runs both audits, and publishes the demo to GitHub Pages
# (https://alcaann.github.io/PPTist-International/). Nothing is published if an audit fails.
# Only GitHub's own actions are used.

on:
  push:
    branches: [international]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org/ --ignore-scripts --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Static audit
        run: node audit/static.mjs

      - name: Live audit (headless Chrome)
        run: node audit/live.mjs

      - name: Merge tests
        run: node audit/merge.mjs

      - name: Two editors on one deck (headless Chrome)
        run: node audit/collab.mjs

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
